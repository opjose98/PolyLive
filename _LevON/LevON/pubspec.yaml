name: levon
description: LevON - Aplicación profesional enfocada al levantamiento arquitectónico, generación de planos y modelado BIM ligero multiplataforma.
publish_to: 'none'
version: 0.5.1-alpha+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.3.3
  vector_math: ^2.1.4
  flutter_riverpod: ^2.5.1
  go_router: ^17.2.2
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.2
  archive: ^3.6.1
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  sensors_plus: ^6.0.0
  geolocator: ^13.0.2
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
